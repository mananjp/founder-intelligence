name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  python:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/ai } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest

  security-scan:
    name: Security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: pnpm audit
        run: pnpm audit

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: fi, POSTGRES_PASSWORD: fi, POSTGRES_DB: fi }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fi" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          for f in db/migrations/*.sql; do psql postgres://fi:fi@localhost:5432/fi -v ON_ERROR_STOP=1 -f $f; done

  # evals run only when prompts / pipeline change (needs secrets, so skipped on forks)
  evals:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            ai: ['apps/ai/src/fi_ai/prompts/**','apps/ai/src/fi_ai/research/**','evals/**']
      - if: steps.f.outputs.ai == 'true'
        uses: astral-sh/setup-uv@v3
      - if: steps.f.outputs.ai == 'true'
        working-directory: apps/ai
        run: uv sync && uv run python -m fi_ai.evals.run --suite golden --fail-under-config
        env:
          LLM_FAST_MODEL: ${{ vars.LLM_FAST_MODEL }}
          LLM_STRONG_MODEL: ${{ vars.LLM_STRONG_MODEL }}

  ai-container:
    name: AI container build + healthcheck gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build fi-ai Docker image
        run: docker build -f infra/docker/ai.Dockerfile -t fi-ai:test .

      - name: Run container & assert healthy status
        run: |
          docker run -d --name fi-ai-smoke fi-ai:test  
          echo "Waiting for fi-ai container to become healthy..."

          for i in {1..20}; do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' fi-ai-smoke 2>/dev/null || echo "not-running")
            echo "[$i/20] Health status: $STATUS"

            if [ "$STATUS" = "healthy" ]; then
              echo "fi-ai container is healthy!"
              docker rm -f fi-ai-smoke
              exit 0
            fi

            sleep 5
          done

          echo "Container failed to become healthy within timeout."
          echo "=== Container logs ==="
          docker logs fi-ai-smoke
          docker rm -f fi-ai-smoke
          exit 1

      - name: Export fi-ai image
        run: set -o pipefail; docker save fi-ai:test | gzip > fi-ai-test.tar.gz

      - name: Upload fi-ai image
        uses: actions/upload-artifact@v4
        with:
          name: fi-ai-image
          path: fi-ai-test.tar.gz
          retention-days: 1

  security-images:
    name: Container image security scan
    needs: ai-container
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download fi-ai image
        uses: actions/download-artifact@v4
        with:
          name: fi-ai-image
          path: artifacts/ai

      - name: Load fi-ai image
        run: set -o pipefail; gunzip -c artifacts/ai/fi-ai-test.tar.gz | docker load

      - name: Build fi-api image
        run: docker build -f infra/docker/api.Dockerfile -t fi-api:security .

      - name: Build fi-web image
        run: docker build -f infra/docker/web.Dockerfile -t fi-web:security .

      - name: Trivy scan fi-api
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: fi-api:security
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Trivy scan fi-web
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: fi-web:security
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Trivy scan fi-ai
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: fi-ai:test
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
