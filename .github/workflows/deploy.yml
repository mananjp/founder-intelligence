name: Deploy & Container Images

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push GHCR Images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: infra/docker/api.Dockerfile
            image: ghcr.io/${{ github.repository }}/api
          - name: web
            dockerfile: infra/docker/web.Dockerfile
            image: ghcr.io/${{ github.repository }}/web
          - name: ai
            dockerfile: infra/docker/ai.Dockerfile
            image: ghcr.io/${{ github.repository }}/ai

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract short SHA
        id: vars
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ matrix.image }}:sha-${{ steps.vars.outputs.short_sha }}
            ${{ matrix.image }}:latest

  render-deploy:
    name: Render Deploy (Sprint 2)
    needs: build-and-push
    runs-on: ubuntu-latest
    # Staged for Sprint 2 with .env secrets setup
    if: false
    steps:
      - name: Trigger Render Deploy Hook
        run: |
          echo "Render deploy hook trigger will be enabled in Sprint 2 with deploy hook URL secret"
