name: Deploy & Container Images

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push GHCR Images
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: infra/docker/api.Dockerfile
            image: ghcr.io/${{ github.repository }}/api
          - name: web
            dockerfile: infra/docker/web.Dockerfile
            image: ghcr.io/${{ github.repository }}/web
          - name: ai
            dockerfile: infra/docker/ai.Dockerfile
            image: ghcr.io/${{ github.repository }}/ai

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract short SHA
        id: vars
        run: echo "short_sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ matrix.image }}:sha-${{ steps.vars.outputs.short_sha }}
            ${{ matrix.image }}:latest

  render-deploy:
    name: Deploy Render staging
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: staging
    concurrency:
      group: render-staging-deploy
      cancel-in-progress: false
    steps:
      - name: Validate staging environment configuration
        shell: bash
        env:
          RENDER_API_DEPLOY_HOOK_URL: ${{ secrets.RENDER_API_DEPLOY_HOOK_URL }}
          RENDER_AI_DEPLOY_HOOK_URL: ${{ secrets.RENDER_AI_DEPLOY_HOOK_URL }}
          RENDER_WORKER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_WORKER_DEPLOY_HOOK_URL }}
          RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}
          STAGING_API_URL: ${{ vars.STAGING_API_URL }}
          STAGING_AI_URL: ${{ vars.STAGING_AI_URL }}
          RENDER_API_SERVICE_ID: ${{ vars.RENDER_API_SERVICE_ID }}
          RENDER_AI_SERVICE_ID: ${{ vars.RENDER_AI_SERVICE_ID }}
          RENDER_WORKER_SERVICE_ID: ${{ vars.RENDER_WORKER_SERVICE_ID }}
        run: |
          set -euo pipefail
          missing=()
          for name in \
            RENDER_API_DEPLOY_HOOK_URL \
            RENDER_AI_DEPLOY_HOOK_URL \
            RENDER_WORKER_DEPLOY_HOOK_URL \
            RENDER_API_TOKEN \
            STAGING_API_URL \
            STAGING_AI_URL \
            RENDER_API_SERVICE_ID \
            RENDER_AI_SERVICE_ID \
            RENDER_WORKER_SERVICE_ID; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf '::error::Missing staging environment values: %s\n' "${missing[*]}"
            echo 'Configure them in GitHub Settings > Environments > staging.'
            exit 1
          fi

          for name in STAGING_API_URL STAGING_AI_URL; do
            value="${!name}"
            if [[ "$value" != https://* ]]; then
              printf '::error::%s must be an https:// URL.\n' "$name"
              exit 1
            fi
          done

      - name: Trigger Render image deployments
        id: deploys
        shell: bash
        env:
          RENDER_API_DEPLOY_HOOK_URL: ${{ secrets.RENDER_API_DEPLOY_HOOK_URL }}
          RENDER_AI_DEPLOY_HOOK_URL: ${{ secrets.RENDER_AI_DEPLOY_HOOK_URL }}
          RENDER_WORKER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_WORKER_DEPLOY_HOOK_URL }}
          IMAGE_URL_API: ghcr.io/mananjp/founder-intelligence/api:sha-${{ needs.build-and-push.outputs.short_sha }}
          IMAGE_URL_AI: ghcr.io/mananjp/founder-intelligence/ai:sha-${{ needs.build-and-push.outputs.short_sha }}
        run: |
          set -euo pipefail

          trigger_deploy() {
            local service="$1"
            local hook="$2"
            local image="$3"
            local output_name="$4"
            local response_file
            local http_code
            local deploy_id

            response_file="$(mktemp)"
            if ! http_code="$(curl --silent --show-error \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --max-time 15 \
              --get \
              --data-urlencode "imgURL=${image}" \
              "$hook")"; then
              echo "::error::Could not contact Render for ${service}."
              cat "$response_file" || true
              rm -f "$response_file"
              return 1
            fi

            if [[ "$http_code" != "200" ]]; then
              if [[ "$http_code" == "202" ]]; then
                echo "::error::Render already has a deployment in progress for ${service}; no deployment ID was returned. Rerun after that deployment completes."
              else
                echo "::error::Render returned HTTP ${http_code} for ${service}. Expected HTTP 200 with a deployment ID."
              fi
              cat "$response_file" || true
              rm -f "$response_file"
              return 1
            fi

            if ! deploy_id="$(jq -er '.deploy.id' "$response_file")"; then
              echo "::error::Render did not return a deployment ID for ${service}."
              cat "$response_file" || true
              rm -f "$response_file"
              return 1
            fi

            echo "${output_name}=${deploy_id}" >> "$GITHUB_OUTPUT"
            echo "${service} deployment started."
            rm -f "$response_file"
          }

          trigger_deploy API "$RENDER_API_DEPLOY_HOOK_URL" "$IMAGE_URL_API" api_deploy_id
          trigger_deploy AI "$RENDER_AI_DEPLOY_HOOK_URL" "$IMAGE_URL_AI" ai_deploy_id
          trigger_deploy WORKER "$RENDER_WORKER_DEPLOY_HOOK_URL" "$IMAGE_URL_AI" worker_deploy_id

      - name: Wait for Render deployments to become live
        shell: bash
        env:
          RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}
          RENDER_API_SERVICE_ID: ${{ vars.RENDER_API_SERVICE_ID }}
          RENDER_AI_SERVICE_ID: ${{ vars.RENDER_AI_SERVICE_ID }}
          RENDER_WORKER_SERVICE_ID: ${{ vars.RENDER_WORKER_SERVICE_ID }}
          API_DEPLOY_ID: ${{ steps.deploys.outputs.api_deploy_id }}
          AI_DEPLOY_ID: ${{ steps.deploys.outputs.ai_deploy_id }}
          WORKER_DEPLOY_ID: ${{ steps.deploys.outputs.worker_deploy_id }}
        run: |
          set -euo pipefail
          log_dir="${RUNNER_TEMP}/render-deploy-logs"
          mkdir -p "$log_dir"

          wait_for_deploy() {
            local service="$1"
            local service_id="$2"
            local deploy_id="$3"
            local response_file
            local http_code
            local status
            local url="https://api.render.com/v1/services/${service_id}/deploys/${deploy_id}"

            response_file="$(mktemp)"
            for attempt in $(seq 1 100); do
              if http_code="$(curl --silent --show-error \
                --output "$response_file" \
                --write-out '%{http_code}' \
                --max-time 5 \
                --header "Authorization: Bearer ${RENDER_API_TOKEN}" \
                --header 'Accept: application/json' \
                "$url")"; then
                :
              else
                http_code="000"
              fi

              if [[ "$http_code" == "200" ]]; then
                if ! status="$(jq -er '.status' "$response_file")"; then
                  echo "${service}: Render returned an invalid deployment response."
                  cat "$response_file" || true
                  rm -f "$response_file"
                  return 1
                fi

                case "$status" in
                  live)
                    echo "${service} deployment is live (deploy ${deploy_id})."
                    rm -f "$response_file"
                    return 0
                    ;;
                  build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                    echo "${service} deployment failed with status ${status}."
                    cat "$response_file" || true
                    rm -f "$response_file"
                    return 1
                    ;;
                  *)
                    echo "${service} deployment status: ${status} (attempt ${attempt}/100)."
                    ;;
                esac
              elif [[ "$http_code" == "000" || "$http_code" == "429" || "$http_code" =~ ^5[0-9]{2}$ ]]; then
                echo "${service}: temporary Render API response HTTP ${http_code} (attempt ${attempt}/100)."
              else
                echo "${service}: Render API returned HTTP ${http_code}."
                cat "$response_file" || true
                rm -f "$response_file"
                return 1
              fi

              sleep 10
            done

            echo "${service} deployment did not become live within the polling window."
            cat "$response_file" || true
            rm -f "$response_file"
            return 1
          }

          wait_for_deploy API "$RENDER_API_SERVICE_ID" "$API_DEPLOY_ID" > "$log_dir/api.log" 2>&1 &
          api_pid=$!
          wait_for_deploy AI "$RENDER_AI_SERVICE_ID" "$AI_DEPLOY_ID" > "$log_dir/ai.log" 2>&1 &
          ai_pid=$!
          wait_for_deploy WORKER "$RENDER_WORKER_SERVICE_ID" "$WORKER_DEPLOY_ID" > "$log_dir/worker.log" 2>&1 &
          worker_pid=$!

          api_result=0
          ai_result=0
          worker_result=0
          wait "$api_pid" || api_result=$?
          wait "$ai_pid" || ai_result=$?
          wait "$worker_pid" || worker_result=$?

          cat "$log_dir/api.log"
          cat "$log_dir/ai.log"
          cat "$log_dir/worker.log"

          if (( api_result != 0 || ai_result != 0 || worker_result != 0 )); then
            echo '::error::At least one Render deployment did not reach live status.'
            exit 1
          fi

          echo 'All three Render deployments are live.'

      - name: Smoke test staging readiness
        shell: bash
        env:
          STAGING_API_URL: ${{ vars.STAGING_API_URL }}
          STAGING_AI_URL: ${{ vars.STAGING_AI_URL }}
        run: |
          set -euo pipefail

          wait_for_ready() {
            local service="$1"
            local base_url="${2%/}"
            local url="${base_url}/health/ready"
            local response_file
            local status="000"
            response_file="$(mktemp)"

            for attempt in $(seq 1 30); do
              status="$(curl --silent --output "$response_file" \
                --write-out '%{http_code}' --max-time 5 "$url" || true)"
              if [[ "$status" == "200" ]]; then
                echo "${service} readiness check passed."
                cat "$response_file"
                rm -f "$response_file"
                return 0
              fi

              echo "${service} not ready (HTTP ${status:-000}); attempt ${attempt}/30."
              sleep 5
            done

            echo "::error::${service} failed its readiness smoke test at ${url}."
            echo 'Last response body:'
            cat "$response_file" || true
            rm -f "$response_file"
            return 1
          }

          wait_for_ready API "$STAGING_API_URL"
          wait_for_ready AI "$STAGING_AI_URL"
