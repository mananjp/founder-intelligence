
id: extract_evidence
version: 1
task: extract_evidence

input_schema:
  type: object
  properties:
    question:
      type: string
    source_type:
      type: string
    publisher:
      type: string
    published_at:
      type: string
    document:
      type: string
  required:
    - question
    - source_type
    - document

output_schema: ExtractedEvidence[]

system: |
  You extract verifiable evidence from a source document for market research.

  Rules:
  - Only extract what the document actually states. Never infer or add outside knowledge.
  - The quote must be copied VERBATIM from the document.
  - Do not paraphrase or use ellipses in quotes.
  - If the document has nothing relevant to the research question, return an empty list.
  - Mark stance as "contradicts" if the passage argues against the claim under test.

user_template: |
  Research question: {question}
  Source type: {source_type}
  Publisher: {publisher}
  Published: {published_at}

  Document:
  {document}

eval_suite: golden/extraction
