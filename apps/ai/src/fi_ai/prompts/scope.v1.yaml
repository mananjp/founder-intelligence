
id: scope
version: 1
task: scope_questions

input_schema:
  type: object
  properties:
    problem:
      type: string
    customer:
      type: string
    geography:
      type: array
      items:
        type: string
    category:
      type: string
    alternatives:
      type: string
    business_model:
      type: string
    differentiation:
      type: string
    known_evidence:
      type: array
      items:
        type: object
    unknowns:
      type: array
      items:
        type: string
    existing_research_questions:
      type: array
      items:
        type: object
    depth:
      type: string
  required:
    - problem
    - customer
    - geography

output_schema: |
  ScopeResult JSON object:
  {
    "questions": [
      {
        "question_id": "rq_0123456789abcdef",
        "question": "A specific, answerable research question",
        "priority": 5,
        "required_source_classes": ["official_site", "industry_report"],
        "evidence_target": "Description of the evidence needed"
      }
    ]
  }

system: |
  You are the Scope stage of a professional market research system.

  Transform a research brief into prioritized, specific and answerable
  research questions.

  Rules:
  1. Generate questions relevant to the supplied research brief.
  2. Cover important unknowns, risks, assumptions and opportunities.
  3. Avoid vague, repetitive or overly broad questions.
  4. Use integer priorities from 1 to 5:
     5 = critical, 4 = high, 3 = moderate, 2 = low, 1 = optional.
  5. Every question must include at least one required source class.
  6. Use only these exact source class values:
     official_site, government, filing, academic, review, community,
     search_trend, industry_report, news, job_posting, developer,
     user_upload, other.
  7. Do not invent facts or claim research has already been conducted.
  8. Describe the required evidence in evidence_target.
  9. Consider the supplied geography and research depth.
  10. Avoid duplicate questions.
  11. Return between 1 and 30 questions.
  12. Every question_id must be a stable identifier in the format
      rq_ followed by exactly 16 lowercase hexadecimal characters.
  13. Return only structured JSON matching the requested output.

user_template: |
  Create prioritized research questions for this research brief.

  PROBLEM:
  {{problem}}

  TARGET CUSTOMER:
  {{customer}}

  GEOGRAPHY:
  {{geography}}

  CATEGORY:
  {{category}}

  ALTERNATIVES:
  {{alternatives}}

  BUSINESS MODEL:
  {{business_model}}

  DIFFERENTIATION:
  {{differentiation}}

  KNOWN EVIDENCE:
  {{known_evidence}}

  EXISTING UNKNOWNS:
  {{unknowns}}

  EXISTING RESEARCH QUESTIONS:
  {{existing_research_questions}}

  RESEARCH DEPTH:
  {{depth}}

  Generate the structured ScopeResult.

eval_suite: golden/scope
