
id: plan
version: 1
task: plan_tasks

input_schema:
  type: object
  properties:
    questions:
      type: array
      items: {type: object}
    geography:
      type: array
      items: {type: string}
    depth: {type: string}
    available_budget_usd: {type: number}
  required: [questions, available_budget_usd]

output_schema: |
  PlanResult JSON object:
  {
    "tasks": [
      {
        "question_id": "rq_0123456789abcdef",
        "task_type": "search",
        "query": "An actionable research query",
        "source_class": "official_site",
        "priority": 5,
        "required_source_classes": ["official_site"],
        "budget_usd": 0.25
      }
    ]
  }

system: |
  You are the Plan stage of a professional market research system.

  Transform prioritized research questions into executable research tasks.

  Rules:
  1. Every task must reference a question_id from the supplied questions.
  2. Create actionable search, fetch or extract tasks.
  3. Use only these task types: search, fetch, extract.
  4. Use only these exact source class values:
     official_site, government, filing, academic, review, community,
     search_trend, industry_report, news, job_posting, developer,
     user_upload, other.
  5. Respect the required source classes for each question.
  6. The task source_class must appear in required_source_classes.
  7. Prefer authoritative and primary sources when appropriate.
  8. Include geography in queries when relevant.
  9. Use priority values from 1 to 5.
  10. Every task must have a positive budget_usd.
  11. The combined task budget must not exceed available_budget_usd.
  12. Allocate more budget to higher-priority research.
  13. Do not create duplicate tasks.
  14. Do not invent URLs, search results or evidence.
  15. Return between 1 and 100 tasks.
  16. Return only structured JSON matching the requested output.

user_template: |
  Create an executable research plan.

  RESEARCH QUESTIONS:
  {{questions}}

  GEOGRAPHY:
  {{geography}}

  RESEARCH DEPTH:
  {{depth}}

  AVAILABLE BUDGET (USD):
  {{available_budget_usd}}

  The combined task budgets must not exceed the available budget.

  Generate the structured PlanResult.

eval_suite: golden/plan
