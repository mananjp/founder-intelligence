services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: fi
      POSTGRES_PASSWORD: fi
      POSTGRES_DB: fi
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fi"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  mailpit:
    image: axllent/mailpit
    ports: ["8025:8025", "1025:1025"]
volumes:
  pgdata:
